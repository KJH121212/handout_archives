<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>핸드아웃 6 - 찢겨진 산해경 필사본</title>
  <style>
    body {
      background-color: #181716;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Batang', serif;
    }
    .torn-sheet {
      width: 480px;
      background: #f1e9d2;
      padding: 36px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border-top: 2px dashed #b8ad92;
      border-bottom: 3px solid #8e836b;
      color: #2b251f;
      line-height: 1.9;
      font-size: 15px;
      word-break: keep-all;
    }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #611818;
      margin-bottom: 8px;
    }
    .entry {
      margin-bottom: 24px;
      background: rgba(0,0,0,0.03);
      padding: 14px;
      border-left: 3px solid #611818;
    }
    .entry:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="torn-sheet">
    <div class="entry">
      <div class="section-title">〈군자국 (君子國)〉</div>
      대인국(大人國)의 북쪽에 사비시(奢比尸)가 사는데, 그곳의 북쪽에 군자국(君子國)이 있다. 군자국 사람들은 의관을 갖추고 칼을 차고 짐승을 잡아먹는다. <strong>두 마리의 큰 호랑이를 옆에 놓고 부린다.</strong> 그 나라 사람들은 사양하기를 좋아하고 다투지 않는다.
    </div>
    <div class="entry">
      <div class="section-title">〈마복 (馬腹)〉</div>
      (...) 짐승이 하나 사는데 이름을 마복(馬腹)이라고 한다. <strong>그 생김새가 사람의 얼굴과 호랑이의 몸을 하였으며 그 소리는 어린아이 같고 사람을 잡아먹는다.</strong>
    </div>
  </div>
</body>
</html>
