<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>핸드아웃 4 - 의문의 쪽지</title>
  <style>
    body {
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Batang', serif;
    }
    .note-paper {
      background: #ece3cf;
      padding: 36px 44px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid #c2b59b;
      position: relative;
      text-align: center;
    }
    .crease {
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: rgba(0, 0, 0, 0.08);
    }
    .incantation {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #2b231d;
      margin: 0;
      text-shadow: 0 0 1px rgba(0,0,0,0.3);
    }
    .ash {
      margin-top: 20px;
      font-size: 12px;
      color: #635b52;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div class="note-paper">
    <div class="crease"></div>
    <div class="incantation">이두두지 저두두지 구만두지 호만두지</div>
    <div class="ash">※ 접혀 있던 흔적과 함께 검은 재가 묻어있습니다.</div>
  </div>
</body>
</html>
