<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>핸드아웃 3 - 신문 조각</title>
  <style>
    body {
      background-color: #1a1a18;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Batang', 'Song Myung', serif;
    }
    .clipping {
      width: 440px;
      background: #e6decb;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      border-left: 2px dashed #b5a995;
      border-right: 2px dashed #b5a995;
      color: #2e2a24;
      line-height: 1.85;
      font-size: 15px;
      word-break: keep-all;
    }
    .headline {
      font-size: 18px;
      font-weight: bold;
      border-bottom: 2px solid #5a5347;
      padding-bottom: 8px;
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 1px;
    }
    p {
      margin: 0;
      text-indent: 10px;
    }
    .highlight {
      background-color: rgba(180, 160, 120, 0.25);
      font-weight: bold;
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #7a7265;
      text-align: right;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div class="clipping">
    <div class="headline">바다의 마물과 오대수의 지혜</div>
    <p>
      (...) 오대수라는 남자가 있었습니다. 오대수는 귀향하기 위해서 바다를 건너가야 했습니다. 
      그 해협에는 노랫소리가 아름다운 <span class="highlight">사이-란</span>이라는 반인반수들이 살았습니다. 
      선원들이 청명한 노래를 듣고 홀려서 암초에 충돌하면, 그들을 건져다 식사를 하고는 했습니다.
    </p>
    <p style="margin-top: 10px;">
      그래서 현명한 오대수는 꾀를 내어 <strong>선원들의 귀를 밀랍과 헝겊으로 막고, 자기 몸은 배의 기둥에 묶었습니다.</strong>
    </p>
    <div class="note">오래되어 누렇게 바랜 종이 뭉치 사이에서 발견된 기사</div>
  </div>
</body>
</html>
