<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>핸드아웃 5 - 우물 안벽의 혈서</title>
  <style>
    body {
      background-color: #070809;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Batang', serif;
    }
    .well-stone {
      width: 500px;
      background: #191c1f;
      padding: 40px;
      border: 3px solid #282c30;
      box-shadow: inset 0 0 60px #000, 0 12px 35px rgba(0,0,0,0.8);
      position: relative;
      color: #b09188;
    }
    .blood-text {
      color: #942525;
      font-size: 19px;
      line-height: 1.8;
      font-weight: bold;
      text-shadow: 1px 1px 2px #000, 0 0 10px rgba(160, 20, 20, 0.4);
      word-break: keep-all;
    }
    .divider {
      border-top: 1px solid #32383d;
      margin: 25px 0 15px 0;
    }
    .illustration-note {
      font-size: 13px;
      color: #69727a;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="well-stone">
    <div class="blood-text">
      그 여자는 죽지 않았다. 다른 사람의 거죽을 뒤집어쓰고 살아있다.<br><br>
      누군가에게 알려야 하는데. 내가 여기서 죽어선 안 되는데.
    </div>
    <div class="divider"></div>
    <div class="illustration-note">
      ※ 글씨 옆으로 남자의 얼굴에 물고기 몸통통을 한 기이한 형상과 함께 <strong>[氐人國(저인국)]</strong>이라는 글자가 거칠게 긁혀 있습니다.
    </div>
  </div>
</body>
</html>
