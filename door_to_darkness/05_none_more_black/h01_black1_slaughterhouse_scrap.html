<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>찢어진 도축장 서류 메모</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Courier+Prime:wght@400;700&family=Nanum+Myeongjo:wght@700;800&family=Nanum+Pen+Script&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #161514;
      background-image:
        radial-gradient(circle at 50% 35%, #272420 0%, #141210 75%, #0c0b0a 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 46px 18px;
      color: #25201b;
      -webkit-font-smoothing: antialiased;
    }

    /* 재킷 주머니에서 꺼낸 찢어진 사업체 서류 반쪽 */
    .scrap-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      transform: rotate(-1.1deg);
      filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.78));
    }

    .scrap-paper {
      position: relative;
      background-color: #ebe0c8;
      background-image:
        radial-gradient(ellipse at 25% 20%, #f1e8d4 0%, #ded0b2 100%),
        /* 주머니 속 접힘선 */
        linear-gradient(
          176deg,
          transparent 48.5%,
          rgba(70, 52, 30, 0.16) 49.3%,
          rgba(255, 250, 238, 0.28) 50%,
          transparent 51%
        ),
        /* 오래된 기름/녹 얼룩 */
        radial-gradient(circle at 82% 76%, rgba(110, 74, 34, 0.17) 0%, transparent 26%),
        radial-gradient(circle at 14% 68%, rgba(88, 62, 32, 0.12) 0%, transparent 22%);
      padding: 34px 48px 34px 38px;
      border-top: 1px solid #c3b293;
      border-left: 1px solid #c3b293;
      border-bottom: 1px solid #b8a584;
      box-shadow: inset 0 0 55px rgba(96, 68, 34, 0.22);
      /* 오른쪽이 찢겨 나간 불규칙한 실루엣 */
      clip-path: polygon(
        0% 0%,
        95% 0%,
        98% 6%,
        92% 13%,
        97% 20%,
        91% 27%,
        96% 35%,
        90% 43%,
        95% 51%,
        89% 59%,
        96% 67%,
        91% 75%,
        95% 83%,
        89% 91%,
        93% 100%,
        0% 100%
      );
      overflow: hidden;
    }

    .paper-noise {
      position: absolute;
      inset: 0;
      opacity: 0.055;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* 상단 옛 도축장 레터헤드 (오른쪽이 찢겨 잘림) */
    .torn-letterhead {
      position: relative;
      z-index: 2;
      border-bottom: 2.5px double #3b3024;
      padding-bottom: 12px;
      margin-bottom: 34px;
      white-space: nowrap;
      overflow: hidden;
    }

    .lh-en {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #362a1e;
      opacity: 0.85;
    }

    .lh-kr {
      font-family: 'Nanum Myeongjo', serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #4b3d2e;
      margin-top: 3px;
    }

    .lh-fade {
      color: rgba(54, 42, 30, 0.35);
    }

    /* 폴 로저스가 연필로 휘갈겨 계산한 몫 */
    .pencil-calc {
      position: relative;
      z-index: 2;
      padding: 8px 6px 26px 14px;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 38px;
      line-height: 1.48;
      color: #2e2f34;
      letter-spacing: 0.8px;
      transform: rotate(-1.4deg);
      text-shadow: 0.4px 0.4px 0 rgba(25, 25, 30, 0.25);
    }

    .calc-line-2 {
      padding-left: 10px;
      color: #222328;
    }

    .calc-underline {
      display: inline-block;
      border-bottom: 2px solid rgba(40, 40, 46, 0.65);
      padding-bottom: 2px;
    }

    /* 하단 찢겨 잘린 주소 푸터 */
    .torn-address {
      position: relative;
      z-index: 2;
      margin-top: 28px;
      padding-top: 10px;
      border-top: 1px solid rgba(59, 48, 36, 0.45);
      font-family: 'Courier Prime', 'Nanum Myeongjo', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #3e3225;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
    }

    .addr-en {
      display: block;
      font-size: 13px;
      letter-spacing: 2px;
      color: #5a4a39;
      margin-top: 2px;
    }

    @media (max-width: 500px) {
      .scrap-paper {
        padding: 26px 36px 26px 24px;
      }
      .lh-en { font-size: 18px; }
      .pencil-calc { font-size: 32px; }
    }

    @media print {
      body { background: none; padding: 0; }
      .scrap-wrapper { transform: none; filter: none; }
      .scrap-paper { box-shadow: none; }
    }
  </style>
</head>
<body>

  <div class="scrap-wrapper">
    <article class="scrap-paper">
      <div class="paper-noise"></div>

      <header class="torn-letterhead">
        <div class="lh-en">CAMPBELL'S MEA<span class="lh-fade">...</span></div>
        <div class="lh-kr">캠벨 식육 가<span class="lh-fade">...</span></div>
      </header>

      <section class="pencil-calc">
        <div>63병 &times; $13 = $819</div>
        <div class="calc-line-2">$819 &times; 15% = <span class="calc-underline">$122.85</span></div>
      </section>

      <footer class="torn-address">
        리버가 143<span class="lh-fade">...</span>
        <span class="addr-en">143 RIVER S<span class="lh-fade">...</span></span>
      </footer>
    </article>
  </div>

</body>
</html>
