<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>앨프레드 해킷의 다급한 쪽지</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #161310;
      background-image:
        radial-gradient(circle at 50% 38%, #28211b 0%, #14110e 70%, #0b0907 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 44px 18px;
      color: #2c2b30;
      -webkit-font-smoothing: antialiased;
    }

    /* 급히 찢어낸 작은 싸구려 메모지 조각 */
    .scrap-wrapper {
      position: relative;
      width: 100%;
      max-width: 470px;
      transform: rotate(-1.6deg);
      filter: drop-shadow(0 20px 36px rgba(0, 0, 0, 0.78));
    }

    .torn-edge {
      display: block;
      width: 100%;
      height: 15px;
    }

    .torn-top {
      margin-bottom: -1px;
    }

    .torn-bottom {
      margin-top: -1px;
    }

    .scrap-paper {
      position: relative;
      background-color: #ece1c9;
      background-image:
        /* 싸구려 메모장 흐릿한 줄 */
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 39px,
          rgba(126, 146, 162, 0.28) 39px,
          rgba(126, 146, 162, 0.28) 40px
        ),
        radial-gradient(ellipse at 25% 20%, rgba(255, 250, 236, 0.42) 0%, transparent 58%),
        radial-gradient(ellipse at 78% 78%, rgba(124, 96, 58, 0.18) 0%, transparent 62%);
      background-position: 0 28px, 0 0, 0 0;
      padding: 34px 38px 38px 42px;
      border-left: 1px solid #c4b598;
      border-right: 1px solid #bdb093;
      box-shadow:
        inset 0 0 55px rgba(108, 82, 46, 0.22),
        inset 0 0 18px rgba(68, 52, 30, 0.12);
      overflow: hidden;
    }

    /* 종이 노이즈 */
    .paper-grain {
      position: absolute;
      inset: 0;
      opacity: 0.065;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* 주머니에 구겨 넣은 사선 구김 자국 */
    .crumples {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          112deg,
          transparent 44%,
          rgba(58, 44, 24, 0.15) 45.2%,
          rgba(255, 252, 244, 0.28) 46.2%,
          transparent 47.4%
        ),
        linear-gradient(
          -14deg,
          transparent 58%,
          rgba(58, 44, 24, 0.13) 59%,
          rgba(255, 250, 240, 0.24) 59.8%,
          transparent 61%
        );
    }

    /* 젖은 손 / 식은땀 번짐 얼룩 */
    .water-smudge-1 {
      position: absolute;
      top: 18px;
      right: 26px;
      width: 96px;
      height: 76px;
      border-radius: 48% 52% 45% 55%;
      background: radial-gradient(ellipse, rgba(132, 108, 72, 0.13) 0%, rgba(132, 108, 72, 0.06) 58%, transparent 74%);
      box-shadow: inset 0 0 8px rgba(108, 84, 52, 0.12);
      transform: rotate(14deg);
      pointer-events: none;
    }

    .water-smudge-2 {
      position: absolute;
      bottom: 14px;
      left: 22px;
      width: 82px;
      height: 58px;
      border-radius: 54% 46% 52% 48%;
      background: radial-gradient(ellipse, rgba(64, 62, 66, 0.1) 0%, transparent 72%);
      transform: rotate(-16deg);
      pointer-events: none;
    }

    /* 떨리고 다급하게 휘갈긴 연필/잉크 필체 */
    .frantic-script {
      position: relative;
      z-index: 2;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 33px;
      line-height: 40px;
      color: #29292e;
      letter-spacing: 0.6px;
      word-break: keep-all;
      transform: skewX(-3deg);
      text-shadow:
        0.5px 0.4px 0 rgba(30, 30, 36, 0.28),
        -0.3px 0.2px 0 rgba(30, 30, 36, 0.12);
    }

    .salutation {
      font-size: 35px;
      color: #1f1f24;
      margin-bottom: 16px;
      transform: rotate(-1.2deg);
    }

    .body-note {
      margin-bottom: 22px;
      transform: rotate(0.5deg);
    }

    .urgent-word {
      color: #19191d;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgba(40, 40, 46, 0.52);
      text-underline-offset: 4px;
    }

    .sign {
      text-align: right;
      padding-right: 8px;
      font-size: 37px;
      color: #1e1e23;
      transform: rotate(-2.4deg);
    }

    @media (max-width: 540px) {
      .scrap-paper {
        padding: 28px 24px 30px 26px;
      }
      .frantic-script {
        font-size: 28px;
        line-height: 36px;
      }
      .salutation {
        font-size: 30px;
      }
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .scrap-wrapper {
        transform: none;
        filter: none;
        max-width: 100%;
      }
      .scrap-paper {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="scrap-wrapper">
    <!-- 거칠게 찢어낸 상단 테두리 -->
    <svg class="torn-edge torn-top" viewBox="0 0 470 15" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0,15 L0,10 L14,4 L29,11 L47,3 L66,9 L84,5 L108,12 L131,4 L156,10 L182,3 L205,11 L234,5 L260,12 L288,4 L315,9 L342,3 L368,11 L396,5 L421,10 L446,4 L470,9 L470,15 Z" fill="#ece1c9" stroke="#c4b598" stroke-width="1"/>
    </svg>

    <article class="scrap-paper">
      <div class="paper-grain"></div>
      <div class="crumples"></div>
      <div class="water-smudge-1"></div>
      <div class="water-smudge-2"></div>

      <div class="frantic-script">
        <div class="salutation">메리 양,</div>

        <p class="body-note">
          알인 것 같은데 무슨 알인지 모르겠습니다. <span class="urgent-word">빨리 와주세요.</span> 부화하면 어떻게 해야 할지 모르겠어요.
        </p>

        <div class="sign">앨프레드</div>
      </div>
    </article>

    <!-- 거칠게 찢어낸 하단 테두리 -->
    <svg class="torn-edge torn-bottom" viewBox="0 0 470 15" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0,0 L470,0 L470,6 L448,12 L422,5 L398,11 L371,4 L344,12 L316,6 L289,13 L262,5 L235,11 L208,4 L180,12 L152,6 L124,11 L96,4 L70,12 L44,5 L21,10 L0,5 Z" fill="#ece1c9" stroke="#c4b598" stroke-width="1"/>
    </svg>
  </div>

</body>
</html>
