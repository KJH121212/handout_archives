<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>습지 마법사의 찢겨 나간 수첩</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Nanum+Pen+Script&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #14110e;
      background-image:
        radial-gradient(circle at 50% 35%, #262019 0%, #14100d 70%, #0a0806 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 46px 18px;
      color: #463423;
      -webkit-font-smoothing: antialiased;
    }

    /* 대부분의 장이 뜯겨 나가고 유일하게 남은 작은 포켓 수첩 한 페이지 */
    .notebook-leaf {
      position: relative;
      display: flex;
      width: 100%;
      max-width: 450px;
      transform: rotate(0.9deg);
      filter: drop-shadow(0 22px 42px rgba(0, 0, 0, 0.8));
    }

    /* 좌측 제본 실밥에서 찢어져 나온 거친 테두리 */
    .ripped-spine {
      flex: 0 0 18px;
      width: 18px;
      height: auto;
      margin-right: -1px;
    }

    .pocket-page {
      position: relative;
      flex: 1;
      background-color: #e5d5b5;
      background-image:
        /* 낡은 수첩의 바랜 가로줄 (34px 간격) */
        repeating-linear-gradient(
          to bottom,
          transparent 0px,
          transparent 33px,
          rgba(122, 98, 66, 0.25) 33px,
          rgba(122, 98, 66, 0.25) 34px
        ),
        radial-gradient(ellipse at 28% 18%, rgba(248, 238, 214, 0.45) 0%, transparent 56%),
        radial-gradient(ellipse at 82% 84%, rgba(114, 78, 38, 0.24) 0%, transparent 62%);
      background-position: 0 32px, 0 0, 0 0;
      padding: 36px 32px 42px 26px;
      border-top: 1px solid #b59d76;
      border-right: 1px solid #ad956e;
      border-bottom: 1px solid #a48c64;
      border-radius: 0 6px 8px 0;
      box-shadow:
        inset 12px 0 20px rgba(74, 52, 26, 0.16),
        inset 0 0 58px rgba(102, 72, 36, 0.24);
      overflow: hidden;
    }

    .paper-grain {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* 습지 습기와 오래된 손때 얼룩 */
    .damp-stain-1 {
      position: absolute;
      top: -12px;
      right: -14px;
      width: 115px;
      height: 105px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(98, 66, 32, 0.18) 0%, rgba(98, 66, 32, 0.06) 58%, transparent 74%);
      pointer-events: none;
    }

    .damp-stain-2 {
      position: absolute;
      bottom: 18px;
      left: 16px;
      width: 90px;
      height: 62px;
      border-radius: 48% 52% 44% 56%;
      background: radial-gradient(ellipse, rgba(84, 56, 28, 0.14) 0%, transparent 70%);
      transform: rotate(-14deg);
      pointer-events: none;
    }

    /* 바랜 갈색-세피아 잉크로 갈겨쓴 간결한 메모 */
    .faded-ink {
      position: relative;
      z-index: 2;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 27px;
      line-height: 34px;
      color: #4d3724;
      letter-spacing: 0.35px;
      word-break: keep-all;
      opacity: 0.92;
      text-shadow: 0.3px 0.3px 0 rgba(58, 38, 20, 0.2);
    }

    .faded-ink p {
      margin-bottom: 18px;
    }

    .chant-memo {
      margin: 10px 0 20px;
      padding: 8px 12px;
      border-left: 2px solid rgba(98, 48, 28, 0.52);
      background: rgba(98, 62, 30, 0.065);
    }

    .chant-line {
      font-size: 28px;
      color: #3f2214;
      letter-spacing: 0.5px;
    }

    .chant-latin {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 14.5px;
      line-height: 1.5;
      color: #5b3e28;
      margin-top: 2px;
    }

    .shout-emphasis {
      color: #3d1c10;
      text-decoration: underline;
      text-decoration-color: rgba(94, 38, 22, 0.5);
      text-underline-offset: 4px;
    }

    .latin-inline {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 16px;
      color: #543620;
    }

    .final-note {
      margin-top: 8px;
      margin-bottom: 0 !important;
      color: #3d2818;
    }

    @media (max-width: 520px) {
      .pocket-page {
        padding: 28px 20px 34px 18px;
      }
      .faded-ink {
        font-size: 24px;
        line-height: 32px;
      }
      .chant-line {
        font-size: 25px;
      }
    }

    @media print {
      body {
        background: none;
        padding: 0;
      }
      .notebook-leaf {
        transform: none;
        filter: none;
        max-width: 100%;
      }
      .pocket-page {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="notebook-leaf">
    <!-- 수첩 제본에서 뜯겨 나간 좌측 톱니/구멍 테두리 -->
    <svg class="ripped-spine" viewBox="0 0 18 540" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M18,0 L8,0 L12,18 L4,38 L11,58 L5,80 L13,102 L4,126 L12,148 L6,172 L13,196 L5,218 L12,242 L4,266 L13,290 L6,314 L12,338 L4,362 L13,386 L5,412 L12,436 L4,462 L11,488 L5,514 L10,540 L18,540 Z"
            fill="#e5d5b5" stroke="#b59d76" stroke-width="1"/>
      <!-- 뜯겨 나간 제본 실 구멍 흔적 -->
      <circle cx="13" cy="92" r="2.2" fill="#1b1611" opacity="0.65"/>
      <circle cx="13" cy="212" r="2.2" fill="#1b1611" opacity="0.65"/>
      <circle cx="13" cy="332" r="2.2" fill="#1b1611" opacity="0.65"/>
      <circle cx="13" cy="452" r="2.2" fill="#1b1611" opacity="0.65"/>
    </svg>

    <article class="pocket-page">
      <div class="paper-grain"></div>
      <div class="damp-stain-1"></div>
      <div class="damp-stain-2"></div>

      <div class="faded-ink">
        <p>
          생물이 언제나 임무를 완수하는 것은 아님. 때로는 완수가 필요하지 않을 수도 있음.
        </p>

        <p style="margin-bottom: 6px;">다음과 같이 돌려보낼 것:</p>

        <div class="chant-memo">
          <div class="chant-line">익 크타 얀 네, 뱌키! 크타 메.</div>
          <div class="chant-latin">(Ick ctha yaahn neh, byakhee! Ctha meh.)</div>
          <div style="margin-top: 2px;">세 번 욀 것.</div>
        </div>

        <p>
          세 번째 읊은 후, 칼날로 왼쪽 눈 밑에서 왼쪽 턱선까지 똑바로 그어 상처에서 나온 피 13방울을 그릇에 담을 것. 피를 입에 머금을 것.
        </p>

        <p>
          <span class="shout-emphasis">크타 메! <span class="latin-inline">(Ctha meh!)</span></span>라고 외치며 생물의 얼굴에 피를 뿜을 것.
        </p>

        <p class="final-note">
          그러면 강제로 별들로 되돌아가게 됨.
        </p>
      </div>
    </article>
  </div>

</body>
</html>
