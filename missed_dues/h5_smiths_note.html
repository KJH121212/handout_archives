<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>찢어진 메모지</title>
    <style>
        body {
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Georgia", serif, "Malgun Gothic";
        }
        .note {
            background: #faf4e1;
            padding: 30px 40px;
            width: 320px;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.5);
            border-left: 2px dashed #c4b998;
            border-top: 1px solid #d4c8a5;
            transform: rotate(-2deg);
        }
        .header {
            font-size: 11px;
            letter-spacing: 2px;
            color: #777;
            text-transform: uppercase;
            border-bottom: 1px solid #c9be9f;
            padding-bottom: 4px;
            margin-bottom: 15px;
        }
        .content {
            font-size: 19px;
            line-height: 1.6;
            color: #1a1a1a;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="note">
    <div class="header">MEMORANDUM</div>
    <div class="content">
        잭 풀턴<br>
        커즌 가 22번지
    </div>
</div>

</body>
</html>
